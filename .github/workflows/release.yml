name: release

# Publishes ghcr.io/<owner>/obs-adapter on every v* tag:
#   v1.0.0 -> 1.0.0, 1.0, latest
# The e2e suites are not part of CI: they need the vendor Java SDK jar and a
# docker host, and are run manually against the published image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=obs-adapter
            org.opencontainers.image.description=OBS server-side API in Go, backed by MinIO
            org.opencontainers.image.licenses=NOASSERTION

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  github-release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          image="${{ env.IMAGE }}"
          notes=$(cat <<EOF
          Container image (linux/amd64, linux/arm64):

          \`\`\`
          docker pull ${image}:${VERSION#v}
          \`\`\`

          Available tags: \`${VERSION#v}\`, \`${VERSION#v%.*}\`, \`latest\`.
          EOF
          )
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$notes" \
            --verify-tag \
            || gh release view "$VERSION"
